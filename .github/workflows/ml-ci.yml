name: Customer Churn ML CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  train-test-deliver:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Train Customer Churn model
      - name: Train customer churn model
        run: python train_model.py

      # 6. Check ML quality gate
      - name: Check ML quality gate
        run: python quality_gate.py

      # 7. Run automated ML tests
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      # 8. Run prediction application tests
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      # 9. Build Docker image
      - name: Build Docker image
        run: docker build -t customer-churn-ml:${{ github.sha }} .

      # 10. Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name customer-churn-ml-container \
            -p 5000:5000 \
            customer-churn-ml:${{ github.sha }}

      # 11. Wait for Flask application to become ready
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs customer-churn-ml-container
          exit 1

      # 12. Test Customer Churn prediction endpoint
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Age": 35,
              "Gender": "Male",
              "Tenure": 24,
              "Usage Frequency": 20,
              "Support Calls": 2,
              "Payment Delay": 5,
              "Subscription Type": "Premium",
              "Contract Length": "Annual",
              "Total Spend": 1200,
              "Last Interaction": 10
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"

      # 13. Show Docker container logs
      - name: Show Docker container logs
        if: always()
        run: docker logs customer-churn-ml-container || true

      # 14. Prepare release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate

          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf "Customer Churn Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      # 15. Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # 16. Stop and remove Docker container
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f customer-churn-ml-container || true
